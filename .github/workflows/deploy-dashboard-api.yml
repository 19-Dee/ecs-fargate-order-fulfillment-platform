name: Deploy Dashboard API

on:
  push:
    branches: [main]
    paths:
      - "services/dashboard-api/**"
      - ".github/workflows/deploy-dashboard-api.yml"
      - ".github/workflows/deploy-service.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: dashboard-api
      task_definition: dashboard_api
      container_name: dashboard-api
